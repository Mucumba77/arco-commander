[workspace]
members = ["crates/arco-app", "crates/arco-core", "crates/arco-windows", "crates/arco-plugin-host"]
default-members = ["crates/arco-app"]
resolver = "3"

[workspace.package]
version = "0.1.0-preview.2"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
arco-core = { path = "crates/arco-core" }
arco-windows = { path = "crates/arco-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.0", default-features = false, features = ["std", "accessibility", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2", "image-default-formats", "unstable-winit-030"] }
slint-build = "=1.17.0"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
