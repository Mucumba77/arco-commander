[package]
name = "arco-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
encoding_rs = "0.8"
filetime = "0.2"
globset = "0.4"
md-5 = "0.10"
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
similar = "2"
tempfile.workspace = true
walkdir = "2"
zeroize = "1"
zip = { version = "9.4.1", default-features = false, features = [
    "aes-crypto", "bzip2", "deflate", "deflate64", "legacy-zip", "lzma", "ppmd", "xz", "zstd",
] }

[lints]
workspace = true
