[package]
name = "arco-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
arco-core.workspace = true
serde_json.workspace = true
zeroize = "1"

[target.'cfg(windows)'.dependencies]
arco-windows.workspace = true
blake3 = "1"
libloading = "0.8"
tempfile.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
