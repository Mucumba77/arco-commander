name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Build workspace
        run: cargo +stable build --locked --workspace
      - name: Check all targets without starting the application
        run: cargo +stable check --locked --workspace --all-targets
      - name: Test workspace
        # Process/SFX integration tests start product executables. The project
        # owner performs those checks; all targets are still compiled above.
        run: cargo +stable test --locked --workspace --lib --bins --test windows_reference -- --test-threads=1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Test managed and COM automation without opening windows
        run: >
          dotnet run --project scripts/automation-reference/Automation.Reference.csproj --
          target/debug/arco-net.exe
          target/dotnet/net10.0-windows/ArcoCommander.Automation.X.manifest
